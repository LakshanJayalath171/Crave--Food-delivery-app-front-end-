<svg xmlns="http://www.w3.org/2000/svg" width="590" height="250" viewBox="20 40 590 250" role="img" aria-labelledby="title desc">
  <title id="title">Crave logo</title>
  <desc id="desc">Crave food-delivery wordmark with transparent background.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="55%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="iconOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>
  <g id="crave-wordmark" transform="translate(35 46)">
    <!-- Speed marks -->
    <path d="M8 132h28M0 153h36M14 174h22" fill="none" stroke="#F97316" stroke-width="8" stroke-linecap="round"/>
    <!-- Stylized C / serving swirl -->
    <path d="M151 85
             C128 57 88 54 61 77
             C34 100 28 139 42 169
             C56 200 88 217 120 211
             C139 208 154 198 166 183
             L143 165
             C132 176 120 181 107 181
             C84 181 67 163 67 140
             C67 117 84 98 107 98
             C119 98 131 103 140 112Z"
          fill="url(#orange)"/>
    <!-- Simple chef hat -->
    <path d="M76 76
             C64 70 61 55 70 44
             C78 34 92 33 102 40
             C106 23 122 14 138 20
             C151 25 157 38 154 51
             C169 51 180 62 179 76
             C178 85 172 92 164 96
             L86 96
             C78 91 75 84 76 76Z"
          fill="#FFF0E5" stroke="#F97316" stroke-width="7" stroke-linejoin="round"/>
    <!-- Hat band -->
    <path d="M83 91h78" stroke="#F97316" stroke-width="7" stroke-linecap="round"/>
    <!-- Small fork motif -->
    <g transform="translate(132 136) rotate(-24)" stroke="#FFF9F3" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M0 0v27"/>
      <path d="M-10 -7v11M-3 -9v13M4 -9v13M11 -7v11"/>
    </g>

    <!-- Brand wordmark -->
    <text x="205" y="178" font-family="Inter, 'Arial Rounded MT Bold', Arial, sans-serif"
          font-size="126" font-weight="800" letter-spacing="-5" fill="#F97316">Crave</text>
    <path d="M210 198h325" stroke="#FDBA74" stroke-width="5" stroke-linecap="round"/>
    <text x="213" y="231" font-family="Inter, Arial, sans-serif"
          font-size="20" font-weight="600" letter-spacing="4" fill="#786B65">GOOD FOOD. GOOD MOOD.</text>
  </g>
</svg>
